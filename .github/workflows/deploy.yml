name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# packages: read is required for GITHUB_TOKEN to pull @al-ummah-now/* from GitHub Packages
permissions:
  contents: read
  packages: read
  actions: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
      repository-projects: write
    name: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript check
        run: pnpm run type-check

      # Fails if a prod config or deploy command would ship the wrong wrangler env
      # (see docs/release-pipeline.md).
      - name: Check wrangler configs
        run: pnpm run check:config

  deploy-auth-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
      repository-projects: write
    name: Deploy Auth Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Apply database migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/auth
          command: d1 migrations apply al-ummah-now-d1 --remote

      - name: Deploy Auth to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/auth
          # wrangler.json's top level is the local dev config (localhost issuer, no
          # secrets); production lives under env.production
          command: deploy --env production

  deploy-profile-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
      repository-projects: write
    name: Deploy Profile Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Deploy Profile to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/profile
          command: deploy

  deploy-admin-production:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
      repository-projects: write
    name: Deploy Admin Production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Build Admin App
        working-directory: apps/admin
        run: pnpm run build

      - name: Deploy Admin to Cloudflare Workers (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/admin
          command: deploy
