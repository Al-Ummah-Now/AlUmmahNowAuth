# Fails when a deployed Worker is missing a required secret, binds a deleted
# Secrets Store secret or a test-only secret in production, or uses a client id
# that is not in that env's auth D1. Manifest: scripts/release/secrets-manifest.ts.
#
# Release pipeline pre-promote step:
#   jobs:
#     secrets:
#       uses: ./.github/workflows/secrets-check.yml
#       with: { env: production }
#       secrets: inherit
name: Secrets Check

on:
  workflow_call:
    inputs:
      env:
        description: 'production, qa, stage, or empty for all'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      env:
        description: 'production, qa, stage, or empty for all'
        type: string
        default: ''
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'apps/*/wrangler*.json'
      - 'apps/*/wrangler*.jsonc'
      - 'scripts/release/secrets-manifest.ts'
      - 'scripts/release/check-secrets.ts'
      - 'scripts/release/cf-api.ts'
      - '.github/workflows/secrets-check.yml'

permissions:
  contents: read

jobs:
  check:
    name: Secrets Check ${{ inputs.env || 'all envs' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Check deployed secrets and client ids
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECK_ENV: ${{ inputs.env }}
        run: |
          set +e
          args=()
          if [ -n "$CHECK_ENV" ]; then args+=(--env "$CHECK_ENV"); fi
          node --experimental-strip-types --no-warnings scripts/release/check-secrets.ts "${args[@]}" | tee secrets-check.txt
          status=${PIPESTATUS[0]}
          { echo '### Secrets check'; echo '```'; cat secrets-check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
