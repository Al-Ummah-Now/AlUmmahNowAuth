name: Rollback

# One-click rollback (docs/release-pipeline.md). Puts workers back on the version
# they served before their latest deployment, or on a given version, then smokes.
# Code only: migrations are expand-only and stay applied.
# The audit consumer is deliberately not an option: it accepts every audit message
# format, so it is safe with any auth version, and its previous versions on production
# are the build that sent every event to the DLQ. To change it, release a fix.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options: [production, stage]
        default: production
      app:
        description: Worker(s) to roll back
        type: choice
        options: [all, auth, profile, admin]
        default: all
      version:
        description: Version id to roll back to (optional; needs a single app)
        type: string
        required: false
      reason:
        description: Why (shown in the Cloudflare deployment history)
        type: string
        default: rollback from GitHub Actions
      dry_run:
        description: Dry run (resolve and print the target versions, move no traffic)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

# Never run alongside a release (it would race the promote)
concurrency:
  group: auth-release
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.app }} (${{ inputs.environment }})${{ inputs.dry_run && ' [dry run]' || '' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - run: pnpm install --frozen-lockfile

      # Inputs go through env, never interpolated into the script
      - name: Roll back and smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--env "$ENVIRONMENT" --app "$APP" --reason "$REASON (by $GITHUB_ACTOR)")
          if [ -n "$VERSION" ]; then args+=(--to "$VERSION"); fi
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node --experimental-strip-types --no-warnings scripts/release/rollback.ts "${args[@]}"
