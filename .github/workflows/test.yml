name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type check
        run: pnpm run type-check

      - name: Auth app dry run
        working-directory: apps/auth
        run: pnpm exec wrangler deploy --dry-run

  security-check:
    runs-on: ubuntu-latest
    name: Security Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --audit-level high --prod

      - name: Check for hardcoded secrets
        run: |
          if grep -r -E "(password|secret|key|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9+/=]{16,}['\"]" apps/ --exclude-dir=node_modules --exclude="*.md" --exclude="test-*"; then
            echo "Hardcoded secrets found!"
            exit 1
          fi

  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required documentation
        run: |
          echo "Checking for required documentation files..."

          required_files=("README.md" "USER_MANAGEMENT.md" "CICD.md")

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file is missing"
              exit 1
            fi
          done

          echo "✅ All required documentation files are present"

  migration-check:
    runs-on: ubuntu-latest
    name: Migration Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check migration files
        run: |
          echo "Checking migration files..."
          ls -la apps/auth/migrations/

          # Validate SQL syntax (basic check)
          for file in apps/auth/migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              # Basic SQL syntax validation
              grep -E "(CREATE|ALTER|INSERT|UPDATE|DELETE)" "$file" > /dev/null || (echo "Invalid SQL in $file" && exit 1)
            fi
          done

          echo "✅ All migration files are valid"

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests (all apps including audit-consumer)
        run: pnpm test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
          retention-days: 30

  # Deploy to QA environment (runs once, before parallel E2E tests)
  deploy-qa:
    runs-on: ubuntu-latest
    name: Deploy to QA
    needs: [lint-and-type-check, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "❌ ERROR: CLOUDFLARE_API_TOKEN secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "❌ ERROR: CLOUDFLARE_ACCOUNT_ID secret is not configured"
            exit 1
          fi
          echo "✅ Required secrets are configured"

      - name: Apply QA database migrations
        working-directory: apps/auth
        run: pnpm run migrations:qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Auth Server to QA
        working-directory: apps/auth
        run: pnpm run deploy:qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Auth Server QA secrets
        working-directory: apps/auth
        run: |
          echo "test-secret-for-e2e" | npx wrangler secret put TEST_PROMOTE_SECRET --config wrangler.qa.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Profile App to QA
        working-directory: apps/profile
        run: pnpm run deploy:qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Dashboard to QA
        working-directory: apps/admin
        run: pnpm run deploy:qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Admin Dashboard QA secrets
        working-directory: apps/admin
        run: |
          echo "e2e-admin-client-secret-12345" | npx wrangler secret put ADMIN_CLIENT_SECRET --config wrangler.qa.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Audit Consumer to QA
        working-directory: apps/audit-consumer
        run: pnpm run deploy:qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for QA services to be ready
        run: |
          echo "Waiting for QA services to be ready..."
          timeout=120
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            if curl -f https://auth.qa.alummahnow.net/.well-known/oauth-authorization-server > /dev/null 2>&1 && \
               curl -f https://profile.auth.qa.alummahnow.net > /dev/null 2>&1 && \
               curl -f https://admin.auth.qa.alummahnow.net > /dev/null 2>&1; then
              echo "✅ All QA services are ready!"
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
            echo "Waiting... ($elapsed/$timeout seconds)"
          done

          echo "❌ Timeout waiting for QA services"
          exit 1

      - name: Warm up QA auth server (pre-load encryption keys)
        run: |
          echo "Warming up auth server to pre-load cryptographic keys..."
          echo "Making warmup requests..."
          for i in 1 2 3; do
            echo "Warmup request $i..."
            start_time=$(date +%s%3N)
            curl -s -o /dev/null -w "%{http_code}" \
              "https://auth.qa.alummahnow.net/authorize?client_id=warmup&response_type=code&redirect_uri=https://profile.auth.qa.alummahnow.net/callback" || true
            end_time=$(date +%s%3N)
            duration=$((end_time - start_time))
            echo "  Request $i took ${duration}ms"
            sleep 1
          done
          echo "✅ Warmup complete - encryption keys should now be loaded"

  # Parallel E2E test jobs by category
  e2e-admin-audit:
    runs-on: ubuntu-latest
    name: E2E Admin Audit (12 tests)
    needs: [deploy-qa]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Admin Audit tests
        run: pnpm exec playwright test e2e/tests/admin/audit-view.spec.ts
        env:
          CI: true
          SKIP_WEB_SERVER: true
          E2E_AUTH_SERVER_URL: https://auth.qa.alummahnow.net
          E2E_PROFILE_URL: https://profile.auth.qa.alummahnow.net
          E2E_ADMIN_URL: https://admin.auth.qa.alummahnow.net
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_PROMOTE_SECRET: test-secret-for-e2e

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results-admin-audit
          path: |
            e2e-report/
            test-results/
          retention-days: 7

  e2e-admin-users:
    runs-on: ubuntu-latest
    name: E2E Admin Users (${{ matrix.shard }}/2)
    needs: [deploy-qa]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Admin User tests (shard ${{ matrix.shard }}/2)
        run: pnpm exec playwright test e2e/tests/admin/user-create.spec.ts e2e/tests/admin/user-edit.spec.ts e2e/tests/admin/user-delete.spec.ts --shard=${{ matrix.shard }}/2
        env:
          CI: true
          SKIP_WEB_SERVER: true
          E2E_AUTH_SERVER_URL: https://auth.qa.alummahnow.net
          E2E_PROFILE_URL: https://profile.auth.qa.alummahnow.net
          E2E_ADMIN_URL: https://admin.auth.qa.alummahnow.net
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_PROMOTE_SECRET: test-secret-for-e2e

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results-admin-users-${{ matrix.shard }}
          path: |
            e2e-report/
            test-results/
          retention-days: 7

  e2e-auth:
    runs-on: ubuntu-latest
    name: E2E Auth (${{ matrix.shard }}/2)
    needs: [deploy-qa]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Auth tests (shard ${{ matrix.shard }}/2)
        run: pnpm exec playwright test e2e/tests/auth/ --shard=${{ matrix.shard }}/2
        env:
          CI: true
          SKIP_WEB_SERVER: true
          E2E_AUTH_SERVER_URL: https://auth.qa.alummahnow.net
          E2E_PROFILE_URL: https://profile.auth.qa.alummahnow.net
          E2E_ADMIN_URL: https://admin.auth.qa.alummahnow.net
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_PROMOTE_SECRET: test-secret-for-e2e

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results-auth-${{ matrix.shard }}
          path: |
            e2e-report/
            test-results/
          retention-days: 7

  e2e-profile-integration:
    runs-on: ubuntu-latest
    name: E2E Profile & Integration (13 tests)
    needs: [deploy-qa]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Profile & Integration tests
        run: pnpm exec playwright test e2e/tests/profile/ e2e/tests/integration/
        env:
          CI: true
          SKIP_WEB_SERVER: true
          E2E_AUTH_SERVER_URL: https://auth.qa.alummahnow.net
          E2E_PROFILE_URL: https://profile.auth.qa.alummahnow.net
          E2E_ADMIN_URL: https://admin.auth.qa.alummahnow.net
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_PROMOTE_SECRET: test-secret-for-e2e

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results-profile-integration
          path: |
            e2e-report/
            test-results/
          retention-days: 7
