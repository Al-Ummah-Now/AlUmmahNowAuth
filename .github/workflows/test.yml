name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# packages: read is required for GITHUB_TOKEN to pull @al-ummah-now/* from GitHub Packages
permissions:
  contents: read
  packages: read

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type check
        run: pnpm run type-check

      - name: Auth app dry run (production config)
        working-directory: apps/auth
        run: pnpm exec wrangler deploy --dry-run --env production

  security-check:
    runs-on: ubuntu-latest
    name: Security Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --audit-level high --prod

      - name: Check for hardcoded secrets
        run: |
          if grep -r -E "(password|secret|key|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9+/=]{16,}['\"]" apps/ --exclude-dir=node_modules --exclude="*.md" --exclude="test-*"; then
            echo "Hardcoded secrets found!"
            exit 1
          fi

  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required documentation
        run: |
          echo "Checking for required documentation files..."

          required_files=("README.md" "USER_MANAGEMENT.md" "CICD.md")

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file is missing"
              exit 1
            fi
          done

          echo "✅ All required documentation files are present"

  # Release-pipeline data and config gates (docs/release-pipeline.md):
  # wrangler configs, append-only migrations, D1 schema snapshot.
  release-checks:
    runs-on: ubuntu-latest
    name: Release Checks (config, migrations, schema)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Release script tests
        run: pnpm test:scripts

      - name: Wrangler config check
        run: pnpm check:config

      - name: Migrations are append-only
        run: pnpm check:migrations "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: D1 schema snapshot is current
        run: pnpm check:schema

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests (all apps including audit-consumer)
        run: pnpm test

      # Fail-closed: deletes coverage output that holds a secret before the public upload.
      - name: Scan coverage reports for secrets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/scan-e2e-output.sh --env GITHUB_TOKEN -- apps/*/coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
          retention-days: 30

  # QA deploy + E2E (reusable workflow). Serialized across all runs: GitHub keeps
  # at most one run in progress and one pending per group; with
  # cancel-in-progress: false a running deploy/E2E is never cancelled.
  qa-e2e:
    name: QA
    needs: [lint-and-type-check, unit-tests, release-checks]
    concurrency:
      group: auth-qa-deploy
      cancel-in-progress: false
    uses: ./.github/workflows/qa-e2e.yml
    secrets: inherit
