name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# packages: read is required for GITHUB_TOKEN to pull @al-ummah-now/* from GitHub Packages
permissions:
  contents: read
  packages: read

# A newer push to a PR cancels that PR's older run (its QA lock is still
# released, see qa-unlock); main pushes and other PRs never cancel each other.
concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm run type-check

      - name: Auth app dry run (production config)
        working-directory: apps/auth
        run: pnpm exec wrangler deploy --dry-run --env production

  security-check:
    runs-on: ubuntu-latest
    name: Security Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --audit-level high --prod

      - name: Check for hardcoded secrets
        run: |
          if grep -r -E "(password|secret|key|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9+/=]{16,}['\"]" apps/ --exclude-dir=node_modules --exclude="*.md" --exclude="test-*"; then
            echo "Hardcoded secrets found!"
            exit 1
          fi

  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required documentation
        run: |
          echo "Checking for required documentation files..."

          required_files=("README.md" "USER_MANAGEMENT.md" "CICD.md")

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file is missing"
              exit 1
            fi
          done

          echo "✅ All required documentation files are present"

  # Release-pipeline data and config gates (docs/release-pipeline.md):
  # wrangler configs, append-only migrations, D1 schema snapshot.
  release-checks:
    runs-on: ubuntu-latest
    name: Release Checks (config, migrations, schema)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Release script tests
        run: pnpm test:scripts

      - name: Wrangler config check
        run: pnpm check:config

      - name: Migrations are append-only
        run: pnpm check:migrations "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: D1 schema snapshot is current
        run: pnpm check:schema

      - name: Built-in theme packages are valid and bundled
        run: pnpm themes:check

      - name: Shared nav stylesheet matches its lock (AlUmmahNow docs/design/NAV.md)
        run: pnpm nav:check

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests (all apps including audit-consumer)
        run: pnpm test

      # Fail-closed: deletes coverage output that holds a secret before the public upload.
      - name: Scan coverage reports for secrets
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_NEW_TEST_PASSWORD: ${{ secrets.E2E_NEW_TEST_PASSWORD }}
        run: bash scripts/ci/scan-e2e-output.sh --env GITHUB_TOKEN -- apps/*/coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
          retention-days: 30

  # QA deploy + E2E (reusable workflow), one run at a time: every run shares the
  # single QA environment. Serialised by the auth-qa lock (scripts/ci/qa-lock.ts,
  # a git ref changed by compare-and-swap; same as AlUmmahNow's E2E lock), not a
  # concurrency group: GitHub keeps one pending run per group, so every newly
  # queued run cancelled the waiting one, and from 2026-11-10 18:55 no main push
  # got its QA deploy at all. Waiting runs now take their turn; none is dropped.
  qa-lock:
    name: QA lock
    needs: [lint-and-type-check, unit-tests, release-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write  # the lock is a git ref
      actions: read  # is the holder run still going?
    outputs:
      holder: ${{ steps.lock.outputs.holder }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Acquire the auth-qa lock
        id: lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts acquire auth-qa --ttl-min 120 --max-wait-min 290

  qa-e2e:
    name: QA
    needs: [qa-lock]
    uses: ./.github/workflows/qa-e2e.yml
    secrets: inherit

  # Pass, fail or cancelled: hand the lock to the next run
  qa-unlock:
    name: QA unlock
    needs: [qa-lock, qa-e2e]
    if: always() && needs.qa-lock.outputs.holder != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Release the auth-qa lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts release auth-qa --holder "${{ needs.qa-lock.outputs.holder }}"
