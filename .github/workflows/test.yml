name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    name: Lint and Type Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@meywd:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type check
        run: pnpm run type-check

      - name: Auth app dry run
        working-directory: apps/auth
        run: pnpm exec wrangler deploy --dry-run

  security-check:
    runs-on: ubuntu-latest
    name: Security Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@meywd:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --audit-level high --prod

      - name: Check for hardcoded secrets
        run: |
          if grep -r -E "(password|secret|key|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9+/=]{16,}['\"]" apps/ --exclude-dir=node_modules --exclude="*.md" --exclude="test-*"; then
            echo "Hardcoded secrets found!"
            exit 1
          fi

  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required documentation
        run: |
          echo "Checking for required documentation files..."

          required_files=("README.md" "USER_MANAGEMENT.md" "CICD.md")

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file is missing"
              exit 1
            fi
          done

          echo "✅ All required documentation files are present"

  migration-check:
    runs-on: ubuntu-latest
    name: Migration Check
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check migration files
        run: |
          echo "Checking migration files..."
          ls -la apps/auth/migrations/

          # Validate SQL syntax (basic check)
          for file in apps/auth/migrations/*.sql; do
            if [ -f "$file" ]; then
              echo "Validating $file"
              # Basic SQL syntax validation
              grep -E "(CREATE|ALTER|INSERT|UPDATE|DELETE)" "$file" > /dev/null || (echo "Invalid SQL in $file" && exit 1)
            fi
          done

          echo "✅ All migration files are valid"

  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@meywd:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests (all apps including audit-consumer)
        run: pnpm test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
          retention-days: 30

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    needs: [lint-and-type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup GitHub Packages
        run: |
          echo "@meywd:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "❌ ERROR: RESEND_API_KEY secret is not configured"
            echo "Please add RESEND_API_KEY to repository secrets"
            echo "Go to: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          fi
          echo "✅ Required secrets are configured"

      - name: Apply local database migrations
        working-directory: apps/auth
        run: pnpm run migrations:local

      - name: Start Auth Server (background)
        working-directory: apps/auth
        run: |
          pnpm dev &
          echo $! > ../../.auth-server.pid
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Start Admin Dashboard (background)
        working-directory: apps/admin
        run: |
          pnpm dev &
          echo $! > ../../.admin-dashboard.pid

      - name: Start Profile App (background)
        working-directory: apps/profile
        run: |
          pnpm dev &
          echo $! > ../../.profile-app.pid

      - name: Start Audit Consumer (background)
        working-directory: apps/audit-consumer
        run: |
          pnpm dev &
          echo $! > ../../.audit-consumer.pid

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          timeout=60
          elapsed=0

          while [ $elapsed -lt $timeout ]; do
            # Auth: 3301, Profile: 3302, Admin: 3303, Consumer: 3304
            if curl -f http://localhost:3301/.well-known/oauth-authorization-server > /dev/null 2>&1 && \
               curl -f http://localhost:3303 > /dev/null 2>&1 && \
               curl -f http://localhost:3302 > /dev/null 2>&1; then
              echo "Core services are ready!"

              # Check audit consumer health (may not be ready immediately)
              if curl -f http://localhost:3304/health > /dev/null 2>&1; then
                echo "Audit consumer is ready!"
              else
                echo "Note: Audit consumer not responding yet (non-blocking)"
              fi

              exit 0
            fi
            sleep 2
            elapsed=$((elapsed + 2))
            echo "Waiting... ($elapsed/$timeout seconds)"
          done

          echo "Timeout waiting for services to start"
          exit 1

      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: true
          SKIP_WEB_SERVER: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e-report/
            e2e-results.json
            e2e-results.xml
            test-results/
          retention-days: 30

      - name: Upload E2E test videos
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-test-videos
          path: test-results/**/*.webm
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          if [ -f .auth-server.pid ]; then
            kill $(cat .auth-server.pid) || true
          fi
          if [ -f .admin-dashboard.pid ]; then
            kill $(cat .admin-dashboard.pid) || true
          fi
          if [ -f .profile-app.pid ]; then
            kill $(cat .profile-app.pid) || true
          fi
          if [ -f .audit-consumer.pid ]; then
            kill $(cat .audit-consumer.pid) || true
          fi
