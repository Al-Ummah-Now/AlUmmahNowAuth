version: 2
updates:
  # npm: the whole pnpm workspace from its root. pnpm-workspace.yaml brings in
  # apps/* and packages/*, and the one pnpm-lock.yaml lives here. Pointing
  # Dependabot at "/apps/*" instead made it edit package.json without the
  # lockfile, so every such PR failed the frozen install in CI.
  # Minor and patch updates arrive as one production PR and one development PR.
  # Majors stay one PR per dependency (all workspace packages together).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # Security updates arrive as one PR too
      security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions: workflows and the composite actions in .github/actions.
  # Minor and patch updates arrive as one PR; majors stay separate.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
