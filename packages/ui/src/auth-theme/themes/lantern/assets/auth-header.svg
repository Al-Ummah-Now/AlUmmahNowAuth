<svg class="hdr" viewBox="0 0 400 110" aria-hidden="true"><style>.demo-gfx{--primary:var(--fanous-color-primary);--on-primary:var(--fanous-color-on-primary);--primary-hover:var(--fanous-color-primary-hover);--primary-pressed:var(--fanous-color-primary-pressed);--primary-edge:var(--fanous-color-primary-edge);--primary-sheen:var(--fanous-color-primary-sheen);--surface:var(--fanous-color-surface);--surface-raised:var(--fanous-color-surface-raised);--hero-start:var(--fanous-color-hero-start);--text-primary:var(--fanous-color-text-primary);--text-secondary:var(--fanous-color-text-secondary);--motif:var(--fanous-color-motif);--focus-ring:var(--fanous-color-focus-ring);--accent:var(--fanous-color-accent)}/* Prototype only. */
.demo-gfx{--metal:var(--on-primary);--mline:var(--primary-edge)}html.dark .demo-gfx{--metal:var(--hero-start);--mline:var(--primary-edge)}html:not(.dark) .nd{display:none}
[dir=ltr] .demo-gfx,.demo-gfx{--sx:-110px;--ex:520px;--dir:1}[dir=rtl] .demo-gfx{--sx:520px;--ex:-110px;--dir:-1}
/* Motion. Base styles are the resting frame, so switching animation off leaves a clean still. */
.breathe{transform-origin:0 62px;animation:breathe 5.3s cubic-bezier(.45,0,.55,1) infinite}.breathe2{transform-origin:50% 55%;transform-box:fill-box;animation:breathe 7.1s cubic-bezier(.45,0,.55,1) infinite -2s}@keyframes breathe{0%,100%{opacity:.32;transform:scale(.94)}50%{opacity:.58;transform:scale(1.08)}}
.wglow{transform-origin:200px 100px;animation:wglow 6.3s ease-in-out infinite -1.3s}@keyframes wglow{0%,100%{opacity:.48;transform:scale(.96)}50%{opacity:.76;transform:scale(1.05)}}.winlit{animation:winlit 4.7s ease-in-out infinite}@keyframes winlit{0%,100%{opacity:1}50%{opacity:.76}}.lsway{animation:lsway 9.1s ease-in-out infinite}@keyframes lsway{0%,100%{transform:rotate(calc(var(--dir)*-1.3deg))}50%{transform:rotate(calc(var(--dir)*1.3deg))}}@keyframes core{0%,100%{opacity:1;transform:scale(1)}40%{opacity:.78;transform:scale(.92)}70%{opacity:.92;transform:scale(1.05)}}
.lit{animation:lit 8.9s ease-in-out infinite}@keyframes lit{0%,100%{opacity:.7}50%{opacity:1}}
.sh1{animation:sh 4.7s ease-in-out infinite}.sh2{animation:sh 6.1s ease-in-out infinite -1.7s}.sh3{animation:sh 7.9s ease-in-out infinite -3.1s}@keyframes sh{0%,100%{opacity:.72}50%{opacity:1}}
.sweep{opacity:0;animation:sweep 9.7s cubic-bezier(.45,0,.55,1) infinite}.sweep.b{animation-duration:11.3s;animation-delay:-4s}@keyframes sweep{0%{opacity:0;transform:translateX(var(--sx))}20%,80%{opacity:.3}100%{opacity:0;transform:translateX(var(--ex))}}
.gl{opacity:0;animation:gl 6.7s ease-in-out infinite}.gl.b{animation-duration:8.3s;animation-delay:-2.6s}.gl.c{animation-duration:10.1s;animation-delay:-5.2s}@keyframes gl{0%,70%,100%{opacity:0}85%{opacity:.3}}
.glow{opacity:.62;transform-origin:200px 70px;animation:glow 6.9s ease-in-out infinite -2.1s}@keyframes glow{0%,100%{opacity:.5;transform:scale(.97)}50%{opacity:.78;transform:scale(1.04)}}.bal{opacity:.62;animation:bal 5.3s ease-in-out infinite}.b2{animation-duration:7.7s;animation-delay:-2s}.b3{animation-duration:6.1s;animation-delay:-3.4s}.b4{animation-duration:9.3s;animation-delay:-1.2s}@keyframes bal{0%,100%{opacity:.48}50%{opacity:.76}}
.hl{opacity:0;animation:hl 10.7s cubic-bezier(.45,0,.55,1) infinite -3s}@keyframes hl{0%{opacity:0;transform:translateX(var(--sx))}10%{opacity:.3}24%{opacity:.3}32%,100%{opacity:0;transform:translateX(var(--ex))}}
.sway{animation:sway var(--d) ease-in-out infinite var(--o)}@keyframes sway{0%,100%{transform:rotate(calc(var(--dir)*-2.2deg))}50%{transform:rotate(calc(var(--dir)*2.2deg))}}
.fl{transform-origin:0 84px;animation:fl var(--d) ease-in-out infinite var(--o)}@keyframes fl{0%,100%{opacity:1;transform:scale(1)}35%{opacity:.76;transform:scale(.9)}65%{opacity:.9;transform:scale(1.06)}}
.halo{transform-origin:0 62px;animation:halo var(--d) ease-in-out infinite var(--o)}@keyframes halo{0%,100%{opacity:.5}50%{opacity:.76}}
.up{opacity:0;animation:up var(--d) linear infinite var(--o)}@keyframes up{0%{opacity:0;transform:translateY(8px)}35%,65%{opacity:.3}100%{opacity:0;transform:translateY(-20px)}}

@media(prefers-reduced-motion:reduce){.demo-gfx *{animation:none!important}}
</style><defs><radialGradient id="u1"><stop offset="0" stop-color="var(--primary-sheen)" stop-opacity=".55"/><stop offset="1" stop-color="var(--primary)" stop-opacity="0"/></radialGradient></defs><path fill="var(--surface)" d="M0 110V92C96 92 168 66 200 6C232 66 304 92 400 92V110Z"/><path class="lit" fill="none" stroke="var(--primary-edge)" stroke-width="1.5" d="M0 92C96 92 168 66 200 6C232 66 304 92 400 92"/><line x1="200" y1="6" x2="200" y2="33" stroke="var(--mline)"/><g transform="translate(200 33) scale(.72)"><g class="lsway"><circle class="breathe nd" cy="62" r="56" fill="url(#u1)"/><circle cy="2" r="3.2" fill="var(--primary)"/><line y1="5" y2="11" stroke="var(--mline)" stroke-width="2"/><path d="M-21 37C-25 24-6 21 0 9C6 21 25 24 21 37Z" fill="var(--metal)" stroke="var(--mline)"/><path d="M-13 37L-24 41V88L-13 92ZM13 37L24 41V88L13 92Z" fill="var(--metal)" stroke="var(--mline)"/><rect x="-13" y="37" width="26" height="55" fill="var(--metal)" stroke="var(--mline)"/><g class="winlit"><path d="M-8 86V60C-8 52-2 50 0 43C2 50 8 52 8 60V86Z" fill="var(--primary-hover)"/><path d="M-21 78V62C-21 56-18 54-18 50-16 54-16 58-16 62V82ZM21 78V62C21 56 18 54 18 50 16 54 16 58 16 62V82Z" fill="var(--primary)"/></g><path d="M-27 92H27L23 100H-23Z" fill="var(--metal)" stroke="var(--mline)"/></g></g></svg>
